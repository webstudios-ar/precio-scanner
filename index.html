<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>PrecioScan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;700;900&display=swap');

  :root {
    --green: #00ff88;
    --green-dim: #00cc66;
    --bg: #0a0e0d;
    --surface: #111815;
    --border: #1e2e25;
    --text: #d4ede2;
    --muted: #4a6b58;
    --red: #ff4466;
    --amber: #ffcc00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
    color: var(--green);
    letter-spacing: 2px;
  }
  .logo span { color: var(--muted); }
  .badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    background: var(--green);
    color: var(--bg);
    padding: 3px 8px;
    border-radius: 2px;
    letter-spacing: 1px;
  }

  /* CAMERA ZONE */
  .cam-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #050807;
    overflow: hidden;
    flex-shrink: 0;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Scanner overlay */
  .scan-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .scan-frame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70%;
    height: 40%;
    border: none;
  }
  .scan-frame::before, .scan-frame::after,
  .scan-frame .corner-br, .scan-frame .corner-bl {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    border-color: var(--green);
    border-style: solid;
  }
  .scan-frame::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
  .scan-frame::after { top: 0; right: 0; border-width: 2px 2px 0 0; }
  .scan-frame .corner-br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
  .scan-frame .corner-bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }

  .scan-line {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    animation: scanMove 2s ease-in-out infinite;
    box-shadow: 0 0 8px var(--green);
  }
  @keyframes scanMove {
    0% { margin-top: -20%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { margin-top: 20%; opacity: 0; }
  }

  .cam-hint {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    white-space: nowrap;
  }

  /* No camera fallback */
  .no-cam {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 100%;
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
  }
  .no-cam .icon { font-size: 36px; }

  /* CAPTURE BUTTON */
  .capture-btn {
    display: flex;
    justify-content: center;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .btn-capture {
    flex: 1;
    max-width: 200px;
    height: 52px;
    background: var(--green);
    border: none;
    border-radius: 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--bg);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .btn-capture:active { transform: scale(0.97); background: var(--green-dim); }
  .btn-capture:disabled { background: var(--border); color: var(--muted); cursor: default; }

  /* MANUAL INPUT */
  .manual-section {
    padding: 16px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .manual-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 8px;
    display: block;
  }
  .manual-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .manual-input {
    flex: 1;
    height: 48px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    padding: 0 14px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    letter-spacing: 1px;
  }
  .manual-input:focus { border-color: var(--green); }
  .manual-input::placeholder { color: var(--muted); font-size: 16px; }
  .btn-calc {
    width: 80px;
    height: 48px;
    background: transparent;
    border: 1px solid var(--green);
    border-radius: 4px;
    color: var(--green);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .btn-calc:active { background: var(--green); color: var(--bg); }

  /* STATUS */
  .status-bar {
    padding: 10px 20px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .status-dot.active { background: var(--green); }
  .status-dot.error { background: var(--red); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* RESULT */
  .result-section {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color 0.3s;
  }
  .result-card.highlight { border-color: var(--green); }
  .result-card.highlight-amber { border-color: var(--amber); }

  .card-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .card-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 42px;
    line-height: 1;
    color: var(--text);
  }
  .card-value.green { color: var(--green); }
  .card-value.amber { color: var(--amber); }
  .card-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .result-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .result-row .result-card .card-value { font-size: 28px; }

  /* OCR PREVIEW */
  #canvasPreview {
    display: none;
    width: 100%;
    border-radius: 4px;
    border: 1px solid var(--border);
    margin-top: 8px;
  }

  /* HISTORY */
  .history-section {
    padding: 0 20px 20px;
  }
  .history-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-clear {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    text-decoration: underline;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
  }
  .history-item .cost { color: var(--muted); }
  .history-item .arrow { color: var(--border); }
  .history-item .sale { color: var(--green); }
  .history-item .psych { color: var(--amber); font-size: 11px; }

  .empty-state {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 20px;
    opacity: 0.5;
  }

  canvas { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">PRECIO<span>SCAN</span></div>
  <div class="badge">+45%</div>
</header>

<!-- CAMERA -->
<div class="cam-wrap" id="camWrap">
  <video id="video" autoplay playsinline muted></video>
  <div class="no-cam" id="noCam">
    <div class="icon">📷</div>
    <span>CÁMARA NO DISPONIBLE</span>
    <span style="font-size:11px">Usá el ingreso manual</span>
  </div>
  <div class="scan-overlay">
    <div class="scan-frame">
      <div class="corner-br"></div>
      <div class="corner-bl"></div>
    </div>
    <div class="scan-line"></div>
  </div>
  <div class="cam-hint">APUNTÁ AL PRECIO</div>
</div>

<canvas id="canvas"></canvas>
<canvas id="canvasPreview"></canvas>

<!-- CAPTURE -->
<div class="capture-btn">
  <button class="btn-capture" id="btnCapture" disabled>ESCANEAR</button>
</div>

<!-- MANUAL -->
<div class="manual-section">
  <span class="manual-label">// INGRESO MANUAL</span>
  <div class="manual-row">
    <input class="manual-input" id="manualInput" type="text" inputmode="decimal" placeholder="ej: 1,44 o 1.44"/>
    <button class="btn-calc" id="btnCalc">CALC</button>
  </div>
</div>

<!-- STATUS -->
<div class="status-bar" id="statusBar">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">Iniciando cámara...</span>
</div>

<!-- RESULT -->
<div class="result-section" id="resultSection">

  <div class="result-card" id="cardMain">
    <span class="card-label">// PRECIO DE VENTA SUGERIDO</span>
    <span class="card-value" id="valMain">—</span>
    <span class="card-sub" id="subMain">Escanea o ingresá un costo</span>
  </div>

  <div class="result-row">
    <div class="result-card" id="cardCost">
      <span class="card-label">// COSTO</span>
      <span class="card-value" id="valCost">—</span>
    </div>
    <div class="result-card" id="cardMargin">
      <span class="card-label">// GANANCIA</span>
      <span class="card-value" id="valMargin">—</span>
    </div>
  </div>

  <div class="result-card" id="cardPsych">
    <span class="card-label">// PRECIO PSICOLÓGICO (.99)</span>
    <span class="card-value amber" id="valPsych">—</span>
    <span class="card-sub" id="subPsych">Redondeado para mejor percepción</span>
  </div>

</div>

<!-- HISTORY -->
<div class="history-section">
  <div class="history-label">
    <span>// HISTORIAL</span>
    <button class="history-clear" id="btnClear">limpiar</button>
  </div>
  <div class="history-list" id="historyList">
    <div class="empty-state">Sin escaneos todavía</div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const btnCapture = document.getElementById('btnCapture');
  const btnCalc = document.getElementById('btnCalc');
  const btnClear = document.getElementById('btnClear');
  const manualInput = document.getElementById('manualInput');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const historyList = document.getElementById('historyList');
  const noCam = document.getElementById('noCam');

  let history = [];
  let isProcessing = false;

  // CAMERA INIT
  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        setStatus('Listo para escanear', 'active');
        btnCapture.disabled = false;
      };
    } catch (e) {
      noCam.style.display = 'flex';
      video.style.display = 'none';
      setStatus('Cámara no disponible — usá ingreso manual', 'error');
      btnCapture.disabled = true;
    }
  }

  function setStatus(msg, type = 'idle') {
    statusText.textContent = msg;
    statusDot.className = 'status-dot';
    if (type === 'active') statusDot.classList.add('active');
    if (type === 'error') statusDot.classList.add('error');
  }

  // PRICE CALCULATION
  function calcPrice(cost) {
    const sale = cost * 1.45;
    const gain = sale - cost;

    // Psychological price
    const floor = Math.floor(sale);
    const psych = floor + 0.99;

    return { cost, sale, gain, psych };
  }

  function psychLabel(sale, psych) {
    if (Math.abs(psych - sale) < 0.01) return 'Precio ya redondeado';
    return psych > sale ? `+$${(psych - sale).toFixed(2)} vs. directo` : `-$${(sale - psych).toFixed(2)} vs. directo`;
  }

  function showResult(cost, fromOCR = false) {
    if (isNaN(cost) || cost <= 0) return;
    const { sale, gain, psych } = calcPrice(cost);

    document.getElementById('valMain').textContent = `$${sale.toFixed(2)}`;
    document.getElementById('valMain').className = 'card-value green';
    document.getElementById('subMain').textContent = fromOCR ? 'Detectado por cámara · 45% de margen' : 'Ingreso manual · 45% de margen';
    document.getElementById('cardMain').className = 'result-card highlight';

    document.getElementById('valCost').textContent = `$${cost.toFixed(2)}`;
    document.getElementById('valMargin').textContent = `$${gain.toFixed(2)}`;

    document.getElementById('valPsych').textContent = `$${psych.toFixed(2)}`;
    document.getElementById('subPsych').textContent = psychLabel(sale, psych);
    document.getElementById('cardPsych').className = 'result-card highlight-amber';

    addHistory(cost, sale, psych);
  }

  function addHistory(cost, sale, psych) {
    history.unshift({ cost, sale, psych, ts: Date.now() });
    if (history.length > 10) history.pop();
    renderHistory();
  }

  function renderHistory() {
    if (history.length === 0) {
      historyList.innerHTML = '<div class="empty-state">Sin escaneos todavía</div>';
      return;
    }
    historyList.innerHTML = history.map(h => `
      <div class="history-item">
        <span class="cost">$${h.cost.toFixed(2)}</span>
        <span class="arrow">→</span>
        <span class="sale">$${h.sale.toFixed(2)}</span>
        <span class="psych">($${h.psych.toFixed(2)})</span>
      </div>
    `).join('');
  }

  // OCR CAPTURE
  btnCapture.addEventListener('click', async () => {
    if (isProcessing) return;
    isProcessing = true;
    btnCapture.disabled = true;
    setStatus('Procesando imagen...', 'active');

    const ctx = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    // Crop to center region (where the scan frame is)
    const cropX = canvas.width * 0.15;
    const cropY = canvas.height * 0.30;
    const cropW = canvas.width * 0.70;
    const cropH = canvas.height * 0.40;

    const cropCanvas = document.createElement('canvas');
    cropCanvas.width = cropW;
    cropCanvas.height = cropH;
    const cropCtx = cropCanvas.getContext('2d');

    // Enhance contrast for better OCR
    cropCtx.filter = 'contrast(1.8) brightness(1.2)';
    cropCtx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

    try {
      const result = await Tesseract.recognize(cropCanvas, 'eng', {
        logger: m => {
          if (m.status === 'recognizing text') {
            setStatus(`OCR: ${Math.round(m.progress * 100)}%`, 'active');
          }
        }
      });

      const text = result.data.text;
      setStatus(`OCR: "${text.trim().substring(0, 40)}"`, 'idle');

      // Extract price from OCR text
      const priceMatch = text.match(/\$?\s*(\d{1,4}[.,]\d{1,2})/);
      if (priceMatch) {
        const raw = priceMatch[1].replace(',', '.');
        const cost = parseFloat(raw);
        if (!isNaN(cost) && cost > 0) {
          setStatus(`Detectado: $${cost.toFixed(2)} ✓`, 'active');
          manualInput.value = cost.toFixed(2);
          showResult(cost, true);
        } else {
          setStatus('No se detectó precio. Ingresá manualmente.', 'error');
        }
      } else {
        setStatus('No se detectó precio. Ingresá manualmente.', 'error');
      }
    } catch (e) {
      setStatus('Error OCR. Usá ingreso manual.', 'error');
    }

    isProcessing = false;
    btnCapture.disabled = false;
  });

  // MANUAL CALC
  function calcManual() {
    const val = parseFloat(manualInput.value.replace(",", ".").trim());
    if (isNaN(val) || val <= 0) {
      setStatus('Ingresá un precio válido', 'error');
      return;
    }
    showResult(val, false);
    setStatus(`Calculado: $${val.toFixed(2)} + 45%`, 'active');
  }
  btnCalc.addEventListener('click', calcManual);
  manualInput.addEventListener('keydown', e => { if (e.key === 'Enter') calcManual(); });

  // CLEAR HISTORY
  btnClear.addEventListener('click', () => {
    history = [];
    renderHistory();
  });

  // INIT
  initCamera();
</script>
</body>
</html>
