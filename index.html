<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>PrecioScan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;700;900&display=swap');
:root{--green:#00ff88;--green-dim:#00cc66;--bg:#0a0e0d;--surface:#111815;--border:#1e2e25;--text:#d4ede2;--muted:#4a6b58;--red:#ff4466;--amber:#ffcc00}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
.logo{font-family:'Share Tech Mono',monospace;font-size:18px;color:var(--green);letter-spacing:2px}
.logo span{color:var(--muted)}
.badge{font-family:'Share Tech Mono',monospace;font-size:11px;background:var(--green);color:var(--bg);padding:3px 8px;border-radius:2px}
.preview-wrap{width:100%;background:#050807;min-height:160px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
#previewImg{width:100%;max-height:240px;object-fit:contain;display:none}
.placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:12px;padding:24px;text-align:center}
.placeholder .icon{font-size:40px}
.photo-wrap{padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
label.btn-foto{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;background:var(--green);border-radius:4px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:2px;color:var(--bg);text-transform:uppercase;-webkit-user-select:none;user-select:none}
label.btn-foto:active{background:var(--green-dim)}
label.btn-foto input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.manual-wrap{padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.lbl{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:8px;display:block}
input.num{width:100%;height:58px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--green);font-family:'Share Tech Mono',monospace;font-size:30px;padding:0 14px;outline:none;-webkit-appearance:none;letter-spacing:2px}
input.num:focus{border-color:var(--green)}
input.num::placeholder{color:var(--muted);font-size:16px}
.status{padding:10px 20px;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);min-height:36px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;animation:blink 1.5s ease-in-out infinite}
.dot.on{background:var(--green)}
.dot.err{background:var(--red);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.cards{flex:1;padding:20px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.card.ok{border-color:var(--green)}
.card.am{border-color:var(--amber)}
.clbl{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.cval{font-family:'Share Tech Mono',monospace;font-size:42px;line-height:1;color:var(--text)}
.cval.g{color:var(--green)}
.cval.a{color:var(--amber)}
.csub{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pair .cval{font-size:28px}
.hist-wrap{padding:0 20px 30px}
.hist-head{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:10px;display:flex;justify-content:space-between}
.hist-head button{background:none;border:none;color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:11px;cursor:pointer;text-decoration:underline}
.hist-list{display:flex;flex-direction:column;gap:6px}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:4px;font-family:'Share Tech Mono',monospace;font-size:13px}
.hist-item .c{color:var(--muted)}
.hist-item .ar{color:var(--border)}
.hist-item .s{color:var(--green)}
.hist-item .p{color:var(--amber);font-size:11px}
.empty{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted);text-align:center;padding:20px;opacity:.5}
</style>
</head>
<body>
<header>
  <div class="logo">PRECIO<span>SCAN</span></div>
  <div class="badge">+45%</div>
</header>
<div class="preview-wrap">
  <img id="previewImg" alt="preview"/>
  <div class="placeholder" id="ph">
    <div class="icon">📷</div>
    <span>SACÁ FOTO A LA PISTOLA DE PRECIOS</span>
  </div>
</div>
<div class="photo-wrap">
  <label class="btn-foto">
    📷 SACAR FOTO
    <input type="file" accept="image/*" capture="environment" id="fileInput"/>
  </label>
</div>
<div class="manual-wrap">
  <span class="lbl">// INGRESO MANUAL</span>
  <input class="num" id="numInput" type="text" inputmode="decimal" placeholder="ej: 1,89"/>
</div>
<div class="status">
  <div class="dot" id="dot"></div>
  <span id="msg">Listo</span>
</div>
<div class="cards">
  <div class="card" id="cMain">
    <span class="clbl">// PRECIO DE VENTA SUGERIDO</span>
    <span class="cval" id="vMain">—</span>
    <span class="csub" id="sMain">Sacá una foto o escribí el costo</span>
  </div>
  <div class="pair">
    <div class="card"><span class="clbl">// COSTO</span><span class="cval" id="vCost">—</span></div>
    <div class="card"><span class="clbl">// GANANCIA</span><span class="cval" id="vGain">—</span></div>
  </div>
  <div class="card" id="cPsych">
    <span class="clbl">// PRECIO PSICOLÓGICO (.99)</span>
    <span class="cval a" id="vPsych">—</span>
    <span class="csub" id="sPsych">Redondeado</span>
  </div>
</div>
<div class="hist-wrap">
  <div class="hist-head"><span>// HISTORIAL</span><button id="btnClear">limpiar</button></div>
  <div class="hist-list" id="histList"><div class="empty">Sin escaneos todavía</div></div>
</div>
<script>
var fi   = document.getElementById('fileInput');
var ni   = document.getElementById('numInput');
var clr  = document.getElementById('btnClear');
var prev = document.getElementById('previewImg');
var ph   = document.getElementById('ph');
var dot  = document.getElementById('dot');
var msg  = document.getElementById('msg');
var hl   = document.getElementById('histList');
var hist = [];
var busy = false;

function setMsg(t,tp){msg.textContent=t;dot.className='dot'+(tp==='on'?' on':tp==='err'?' err':'');}

function showResult(cost,fromPhoto){
  if(isNaN(cost)||cost<=0)return;
  var sale=cost*1.45,gain=sale-cost,psych=Math.floor(sale)+0.99;
  document.getElementById('vMain').textContent='$'+sale.toFixed(2);
  document.getElementById('vMain').className='cval g';
  document.getElementById('sMain').textContent=fromPhoto?'Foto · 45% margen':'Manual · 45% margen';
  document.getElementById('cMain').className='card ok';
  document.getElementById('vCost').textContent='$'+cost.toFixed(2);
  document.getElementById('vGain').textContent='$'+gain.toFixed(2);
  document.getElementById('vPsych').textContent='$'+psych.toFixed(2);
  document.getElementById('cPsych').className='card am';
  hist.unshift({cost:cost,sale:sale,psych:psych});
  if(hist.length>10)hist.pop();
  renderHist();
}

function renderHist(){
  if(!hist.length){hl.innerHTML='<div class="empty">Sin escaneos todavía</div>';return;}
  hl.innerHTML=hist.map(function(h){
    return '<div class="hist-item"><span class="c">$'+h.cost.toFixed(2)+'</span><span class="ar">→</span><span class="s">$'+h.sale.toFixed(2)+'</span><span class="p">($'+h.psych.toFixed(2)+')</span></div>';
  }).join('');
}

function extractPrices(text){
  var ms=text.match(/$?\s*(\d{1,4}[.,]\d{1,2})/g)||[];
  return ms.map(function(m){return parseFloat(m.replace(/[^0-9.,]/g,'').replace(',','.'));})
           .filter(function(p){return !isNaN(p)&&p>=0.05&&p<=999;});
}

/* ---- FOTO: pasar File directo a Tesseract, sin canvas ---- */
fi.addEventListener('change',function(){
  var file=this.files[0];
  if(!file||busy)return;
  busy=true;
  
  // Mostrar preview
  var url=URL.createObjectURL(file);
  prev.src=url;
  prev.style.display='block';
  ph.style.display='none';
  
  setMsg('Escaneando foto...','on');
  
  // Pasar el File directamente a Tesseract — sin canvas, sin conversión
  Tesseract.recognize(file,'eng',{
    logger:function(m){
      if(m.status==='recognizing text')
        setMsg('OCR: '+Math.round(m.progress*100)+'%','on');
    }
  }).then(function(r){
    var txt=r.data.text;
    setMsg('Texto: "'+txt.trim().substring(0,50)+'"','');
    var prices=extractPrices(txt);
    if(prices.length>0){
      var cost=Math.min.apply(null,prices);
      setMsg('Detectado: '+prices.map(function(p){return '$'+p.toFixed(2);}).join(' | ')+' → $'+cost.toFixed(2),'on');
      ni.value=cost.toFixed(2).replace('.',',');
      showResult(cost,true);
    }else{
      setMsg('No se detectó precio. Ingresá manualmente.','err');
    }
    URL.revokeObjectURL(url);
    busy=false;
    fi.value='';
  }).catch(function(e){
    setMsg('Error: '+e.message,'err');
    busy=false;
    fi.value='';
  });
});

/* ---- MANUAL ---- */
ni.addEventListener('input',function(){
  var v=parseFloat(this.value.replace(',','.').trim());
  if(!isNaN(v)&&v>0){showResult(v,false);setMsg('$'+v.toFixed(2)+' + 45%','on');}
});
ni.addEventListener('click',function(){if(this.value.trim()!=='')this.select();});
clr.addEventListener('click',function(){hist=[];renderHist();});
</script>
</body>
</html>
